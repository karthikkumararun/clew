name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo clippy -- -D warnings
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri
      - run: pnpm tauri build --debug --no-bundle

  # Database integration tests (PostgreSQL, MySQL, MariaDB, SSH bastion, TLS) need Docker, which
  # the macOS and Windows runners do not have.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev pkg-config openssh-client
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Test certificates and SSH keys
        run: ./scripts/gen-test-certs.sh
      - name: Start the databases
        run: docker compose up -d --build --wait
      - name: Integration tests
        run: cargo test --features integration
        working-directory: src-tauri
      - name: Generated TypeScript bindings are up to date
        run: git diff --exit-code -- src/lib/ipc/generated
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Stop the databases
        if: always()
        run: docker compose down -v
