name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Icons are up to date, no default Tauri art, goldens match
        run: pnpm check:icons
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo clippy -- -D warnings
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri
      # A full app build is a smoke test of the bundle step; it adds minutes to every push, so it
      # runs on main (and on demand), not on pull requests.
      - if: github.event_name != 'pull_request'
        run: pnpm tauri build --debug --no-bundle
      - name: Build has no e2e test mode
        if: github.event_name != 'pull_request'
        run: pnpm check:no-test-mode
      # Bundle step with the real icons: the .app carries our icon.icns, and no dev badge ships.
      - name: Bundle icons (macOS)
        if: github.event_name != 'pull_request' && runner.os == 'macOS'
        run: |
          pnpm tauri build --debug --bundles app
          cmp src-tauri/icons/icon.icns src-tauri/target/debug/bundle/macos/Clew.app/Contents/Resources/icon.icns
          ! cmp -s src-tauri/icons/dev/icon.icns src-tauri/target/debug/bundle/macos/Clew.app/Contents/Resources/icon.icns
      - name: Executable icon resource (Windows)
        if: github.event_name != 'pull_request' && runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $exe = (Resolve-Path src-tauri/target/debug/clew.exe).Path
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($exe)
          if ($icon.Width -lt 32) { throw "executable icon missing" }
          $bytes = [IO.File]::ReadAllBytes($exe)
          $ico = [IO.File]::ReadAllBytes("src-tauri/icons/icon.ico")
          $count = [BitConverter]::ToUInt16($ico, 4)
          Write-Host "icon.ico lists $count sizes; executable icon extracted at $($icon.Width)px"

  # Database integration tests (PostgreSQL, MySQL, MariaDB, SSH bastion, TLS) need Docker, which
  # the macOS and Windows runners do not have.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev pkg-config openssh-client
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Test certificates and SSH keys
        run: ./scripts/gen-test-certs.sh
      - name: Start the databases
        run: docker compose up -d --build --wait
      - name: Integration tests
        run: cargo test --features integration
        working-directory: src-tauri
      - name: Generated TypeScript bindings are up to date
        run: git diff --exit-code -- src/lib/ipc/generated
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Stop the databases
        if: always()
        run: docker compose down -v
