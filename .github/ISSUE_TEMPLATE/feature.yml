name: Feature request
description: Suggest an improvement or a new capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation, not the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        [
          SQL console,
          Data grid,
          Explorer,
          Connections,
          NoSQL,
          AI assistant,
          Packaging and updates,
          Other,
        ]
    validations:
      required: true
