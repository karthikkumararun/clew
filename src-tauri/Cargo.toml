[package]
name = "clew"
version = "0.1.0"
description = "Clew — an open-source database IDE"
authors = ["ADK"]
edition = "2021"
license = "MIT"

[lib]
name = "clew_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
