[package]
name = "clew"
version = "0.1.0"
description = "Clew — an open-source database IDE"
authors = ["ADK"]
edition = "2021"
license = "MIT"

[lib]
name = "clew_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "postgres", "mysql", "tls-rustls-ring-native-roots", "mysql-rsa"] }
tauri-plugin-window-state = "2"
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
rust_decimal = { version = "1.43.0", features = ["serde-str"] }
uuid = { version = "1.28.0", features = ["serde", "v4"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
futures = "0.3.34"
russh = "0.64.1"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
rustls-native-certs = "0.8.4"
rustls-pemfile = "2.2.0"
ts-rs = { version = "12.0.1", features = ["serde-json-impl", "no-serde-warnings"] }
keyring = { version = "3", features = ["apple-native", "windows-native"] }
ulid = "3.0.0"
url = "2"
percent-encoding = "2"
tauri-plugin-dialog = "2"
notify = "8"
argon2 = "0.5"
aes-gcm = "0.10"
zeroize = "1"
base64 = "0.22"
sha2 = "0.10"
quick-xml = "0.37"
keepass = { version = "0.15.0", features = ["save_kdbx4"] }
sqlparser = { version = "0.63.0", features = ["visitor"] }
duckdb = { version = "1.10506.0", features = ["bundled"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json", "query"] }
tiberius = { version = "0.13.0", default-features = false, features = ["tds73", "rustls", "chrono", "rust_decimal"] }
tokio-util = { version = "0.7.20", features = ["compat"] }
oracle = "0.6.3"
mongodb = { version = "3.9.1", default-features = false, features = ["rustls-tls", "compat-3-0-0"] }
redis = { version = "1.7.1", default-features = false, features = ["tokio-comp", "tokio-rustls-comp", "tls-rustls-insecure", "aio"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[features]
# End-to-end test mode (isolated data dir, file secrets, scripted dialogs). Never in release builds.
e2e = []
# Integration tests that need the docker-compose services (see docker-compose.yml).
integration = []
# SQL Server and Oracle: big images, run on a schedule (see .github/workflows/heavy-integration.yml).
integration-heavy = ["integration"]

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
tempfile = "3.27.0"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[target."cfg(windows)".dependencies]
tiberius = { version = "0.13.0", default-features = false, features = ["winauth"] }

# Dependencies don't need debug info in dev builds. DuckDB's bundled C++ alone makes the debug
# artifacts huge, which slows linking every test binary and every CI cache save.
# Line tables are enough for backtraces and keep target/ (and link times) small.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
