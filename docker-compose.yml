# Integration-test databases. Test-only credentials; never use these anywhere real.
#   scripts/gen-test-certs.sh   (once, creates docker/postgres-tls/certs and docker/bastion/keys)
#   docker compose --profile core --profile nosql up -d --build --wait
#     profiles: core (PostgreSQL, TLS variants, MySQL, MariaDB, SSH bastion), nosql (MongoDB, Redis),
#     graph (Neo4j, seeded from docker/neo4j/seed.cypher), heavy (SQL Server, Oracle, ClickHouse).
#     `pnpm qa:up` picks them for you.
#   cargo test --features integration   (in src-tauri/)
services:
  postgres:
    profiles: [core]
    image: postgres:16
    environment:
      POSTGRES_USER: clew
      POSTGRES_PASSWORD: clew
      POSTGRES_DB: clew
    ports: ["54316:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clew -d clew"]
      interval: 2s
      timeout: 3s
      retries: 30

  postgres-tls:
    profiles: [core]
    build: ./docker/postgres-tls
    environment:
      POSTGRES_USER: clew
      POSTGRES_PASSWORD: clew
      POSTGRES_DB: clew
    ports: ["54317:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clew -d clew"]
      interval: 2s
      timeout: 3s
      retries: 30

  postgres-tls-wrong:
    profiles: [core]
    build:
      context: ./docker/postgres-tls
      args:
        CERT: wrong
    environment:
      POSTGRES_USER: clew
      POSTGRES_PASSWORD: clew
      POSTGRES_DB: clew
    ports: ["54318:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clew -d clew"]
      interval: 2s
      timeout: 3s
      retries: 30

  mysql:
    profiles: [core]
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: clew
      MYSQL_DATABASE: clew
      MYSQL_USER: clew
      MYSQL_PASSWORD: clew
    ports: ["33068:3306"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -pclew --silent"]
      interval: 3s
      timeout: 3s
      retries: 40

  mongo:
    profiles: [nosql]
    image: mongo:8
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports: ["27117:27017"]
    healthcheck:
      # initiates the single-node replica set on first run, then reports it healthy
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval
          "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }"
          | grep -q 1
      interval: 3s
      timeout: 10s
      retries: 40

  redis:
    profiles: [nosql]
    image: redis:7
    ports: ["63791:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Neo4j community. Bolt on 17687, HTTP on 17474. The healthcheck loads the seed (a small shop
  # graph: User, Product, Order, Category), so `--wait` returns once the data is there.
  neo4j:
    profiles: [graph]
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/clewclew
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 128m
      # what a neo4j:// client is told to connect to next (routing): the published port
      NEO4J_server_bolt_advertised__address: localhost:17687
    ports: ["17687:7687", "17474:7474"]
    volumes:
      - ./docker/neo4j:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "sh /seed/healthcheck.sh"]
      interval: 3s
      timeout: 30s
      retries: 60

  clickhouse:
    profiles: [heavy]
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_DB: clew
      CLICKHOUSE_USER: clew
      CLICKHOUSE_PASSWORD: clew
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports: ["8123:8123"]
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8123/ping || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 40

  mssql:
    profiles: [heavy]
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Clew_test_1"
      MSSQL_PID: Developer
    ports: ["14331:1433"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Clew_test_1 -Q 'SELECT 1' || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 40

  oracle:
    profiles: [heavy]
    image: gvenzl/oracle-free:23-slim-faststart
    environment:
      ORACLE_PASSWORD: clew
      APP_USER: clew
      APP_USER_PASSWORD: clew
    ports: ["15211:1521"]
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 60

  mariadb:
    profiles: [core]
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: clew
      MARIADB_DATABASE: clew
      MARIADB_USER: clew
      MARIADB_PASSWORD: clew
    ports: ["33071:3306"]
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 40

  # Deterministic OpenAI- and Anthropic-compatible server for the AI assistant journeys.
  mock-llm:
    profiles: [ai-mock]
    build: ./docker/mock-llm
    ports: ["18089:8080"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/health || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 20

  # SSH bastion that can reach the databases above by service name.
  bastion:
    profiles: [core]
    build: ./docker/bastion
    ports: ["2222:22"]
    volumes:
      - ./docker/bastion/keys:/keys:ro
    depends_on:
      postgres:
        condition: service_healthy
